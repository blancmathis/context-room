name: Build remote Context Room image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.remote
      - bin/context-room-remote.mjs
      - docs/**
      - package.json
      - package-lock.json
      - profiles/**
      - schemas/**
      - src/**
      - .github/workflows/remote-image.yml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/context-room/remote:${{ github.sha }}
          cache-from: type=gha,scope=context-room-remote
          cache-to: type=gha,mode=max,scope=context-room-remote
      - name: Verify boot-critical runtime assets
        run: |
          image='ghcr.io/${{ github.repository_owner }}/context-room/remote@${{ steps.build.outputs.digest }}'
          docker run --rm "$image" node --input-type=module --eval "import fs from 'node:fs'; import os from 'node:os'; import path from 'node:path'; import { initializeContextRoomProject } from './src/context_room.mjs'; initializeContextRoomProject(fs.mkdtempSync(path.join(os.tmpdir(), 'context-room-image-')));"
      - name: Sign and record exact image
        run: |
          image='ghcr.io/${{ github.repository_owner }}/context-room/remote@${{ steps.build.outputs.digest }}'
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/remote-image.yml@refs/heads/main' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          printf '%s\n' "$image" > context-room-remote.image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-room-remote-${{ github.sha }}
          path: context-room-remote.image
          if-no-files-found: error
          retention-days: 30
      - name: Create the Peerlab QM deployment token
        id: qm-deploy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PEERLAB_QM_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PEERLAB_QM_DEPLOY_APP_PRIVATE_KEY }}
          owner: blancmathis
          repositories: peerlab-qm
          permission-actions: write
      - name: Dispatch the exact signed image to Peerlab QM
        env:
          GH_TOKEN: ${{ steps.qm-deploy-token.outputs.token }}
        run: |
          image="$(tr -d '\n' < context-room-remote.image)"
          if [[ ! "${image}" =~ ^ghcr\.io/blancmathis/context-room/remote@sha256:[0-9a-f]{64}$ ]]; then
            echo "The signed Context Room image reference is invalid." >&2
            exit 1
          fi
          gh workflow run update-context-room-image.yml \
            --repo blancmathis/peerlab-qm \
            --ref main \
            -f source_sha="${GITHUB_SHA}" \
            -f image="${image}"
