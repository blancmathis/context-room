name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      # Node 22.23.1 can SIGTRAP in V8 SourceTextModule on the Linux runner while
      # the parallel test suite is active. Keep the last verified patch release,
      # and cover the Node 24 runtime used by the remote image.
      matrix:
        node-version: [20, 22.23.0, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Context Room
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Package dry run
        if: matrix.node-version == '22.23.0'
        run: npm pack --dry-run

  browser:
    name: Browser QA (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install supported browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test executable layout contract
        run: npm run test:layout -- --project=${{ matrix.project }}
      - name: Test critical UX flows
        run: npm run test:ux-smoke -- --project=${{ matrix.project }}
      - name: Test accessibility contract
        run: npm run test:a11y -- --project=${{ matrix.project }}
      - name: Test performance budgets
        if: matrix.project == 'chromium-desktop'
        run: npm run test:perf
      - name: Upload Browser QA artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-browser-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  soak:
    name: Soak
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test sustained navigation and state integrity
        run: npm run test:ux-soak
      - name: Upload Soak artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [unit, browser, soak]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every release check
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$SOAK_RESULT" = success
