plugins { id 'com.android.application' }

// Explicit upgrade profile: one source tree, a separate output directory and
// the original signing identity. The ordinary preview remains a separate app.
def legacyRecovery = providers.gradleProperty('contextRoomLegacyRecovery').orElse('false').get() == 'true'
def legacyCode = legacyRecovery ? providers.gradleProperty('contextRoomLegacyVersionCode').get().toInteger() : 1
// Debug recovery builds are re-signed by scripts/sign-android-apk.sh with the preserved key on the owner's Mac.
// -PcontextRoomLegacyKeystore points the Gradle signature at a disposable key; the default is the preserved one.
def legacyKey = new File(providers.gradleProperty('contextRoomLegacyKeystore')
    .orElse(new File(System.getProperty('user.home'), '.local/share/lisiere/signing/development.keystore').path).get())
if (legacyRecovery) {
    if (legacyCode <= 0) throw new GradleException('Legacy recovery needs an explicit positive version code.')
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir('.local/legacy-recovery-build/app'))
}
// The release artifact is unsigned: the owner's Mac signs it with the stable tablet key.
def releaseCode = providers.gradleProperty('contextRoomVersionCode').orElse('10').get().toInteger()
def releaseName = providers.gradleProperty('contextRoomVersionName').orElse('0.1.0-preview').get()

android {
    namespace 'app.contextroom.tablet'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId legacyRecovery ? 'fr.lisiere.android' : 'app.contextroom.tablet'
        minSdk 28
        targetSdk 35
        // Increment the preview artifact for each installed functional milestone.
        versionCode legacyRecovery ? legacyCode : releaseCode
        versionName legacyRecovery ? '0.1.0-recovery-preview' : releaseName
        // The recovery app stays visibly distinct so the wrong installation is never removed.
        manifestPlaceholders = [appLabel: legacyRecovery ? 'Lisière · récupération' : 'Context Room']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            storeFile legacyRecovery ? legacyKey : rootProject.file('.local/preview.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { applicationIdSuffix legacyRecovery ? '' : '.preview'; debuggable true }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/notebook-assets')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/shared-web-assets')
    packaging { jniLibs { pickFirsts += ['lib/*/libc++_shared.so'] } }
}

// Package the actual portable client; never maintain an Android fork of its outbox.
def notebookAssets = tasks.register('notebookAssets', Sync) {
    from('../../src') { include 'notebook_client.mjs', 'notebook_protocol.mjs', 'notebook_gestures.mjs', 'notebook_native.mjs' }
    into(layout.buildDirectory.dir('generated/notebook-assets/core'))
}
def sharedWebAssets = tasks.register('sharedWebAssets', Exec) {
    workingDir rootProject.file('..')
    inputs.files(fileTree('../../src') { include '**/*.mjs', '**/*.js', '**/*.css', '**/*.png' })
    inputs.file('../../scripts/prepare-android-web.mjs')
    outputs.dir(layout.buildDirectory.dir('generated/shared-web-assets'))
    commandLine 'node', 'scripts/prepare-android-web.mjs', layout.buildDirectory.dir('generated/shared-web-assets').get().asFile.absolutePath
}
tasks.matching { it.name == 'validateSigningDebug' }.configureEach {
    doFirst {
        if (legacyRecovery && !legacyKey.isFile()) throw new GradleException('Legacy recovery needs its signing key: ' + legacyKey)
    }
}
tasks.named('preBuild').configure { dependsOn notebookAssets, sharedWebAssets }

dependencies {
    implementation 'com.onyx.android.sdk:onyxsdk-pen:1.5.4'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
